services:
  redis:
    image: redis:7-alpine
    container_name: dnd-telegram-bot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  dnd-telegram-bot:
    build: .
    container_name: dnd-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  redis_data:
